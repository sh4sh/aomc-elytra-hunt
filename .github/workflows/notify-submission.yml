name: Notify about submissions from the app

# Submissions from the app are filed by the relay using the repository owner's
# token, and GitHub does not notify people about their own issues. A comment
# from the Actions bot that mentions the owner does notify them.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  notify:
    if: >-
      contains(github.event.issue.labels.*.name, 'map-submission') ||
      contains(github.event.issue.labels.*.name, 'ship-report')
    runs-on: ubuntu-latest
    steps:
      - name: Mention the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue comment "$NUMBER" --body "@$OWNER a player sent this from the app. To accept it, reply to this issue with \`/merge\`: that applies it, updates the site and closes the issue. To reject it, just close the issue."
