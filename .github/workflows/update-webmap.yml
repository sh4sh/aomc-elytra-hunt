name: Update webmap data

# Keeps public/explored.json in step with the community webmap. The script only
# asks the webmap what has changed, one request at a time: a routine run is
# about ten small requests, and a wider check for newly mapped regions happens
# once a day. Nothing is committed unless the webmap actually changed.

# Started once an hour by the Cloudflare relay in relay/, whose timer is punctual.
# GitHub's own schedule is kept as a slow fallback in case the relay is down; it
# often runs late or not at all.
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-webmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run explored
      - name: Publish if the webmap changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/explored.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/explored.json
          git commit -m "Update webmap data"
          git push
          # A push made by this job does not start other workflows, so the site is rebuilt explicitly.
          gh workflow run pages.yml --ref main
